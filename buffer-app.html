// Hand-rolled sparkline (no charting library dependency) — mirrors the
// recharts line the artifact version used: same padded min/max domain.
function Sparkline({ data }) {
  if (!data || data.length < 2) return null;
  const values = data.map((d) => d.balance);
  const min = Math.min(...values) - 1000;
  const max = Math.max(...values) + 1000;
  const range = max - min || 1;
  const w = 300;
  const h = 48;
  const points = data
    .map((d, i) => {
      const x = (i / (data.length - 1)) * w;
      const y = h - ((d.balance - min) / range) * h;
      return `${x.toFixed(2)},${y.toFixed(2)}`;
    })
    .join(" ");
  return (
    <svg viewBox={`0 0 ${w} ${h}`} preserveAspectRatio="none" className="w-full h-full">
      <polyline points={points} fill="none" stroke="#3FA796" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />
    </svg>
  );
}

function seedRandom(seed) {
  let s = seed;
  return () => {
    s = (s * 9301 + 49297) % 233280;
    return s / 233280;
  };
}

function shortAddr(a) {
  return `${a.slice(0, 6)}...${a.slice(-4)}`;
}

function buildInitialState(source) {
  return {
    source,
    day: 1,
    cycleDay: 1,
    balance: 0,

    wallet: { usdt: 25 },
    linkedBank: null, // { bank, last4 }

    savings: { mode: null, percent: 10, periodDays: 30, stakes: [] }, // mode: null | "manual" | "ai"
    history: [{ day: 1, balance: 0 }],
    log: [],
    crunchDay: null,
    released: false,
    aiPending: false,
    rand: seedRandom(7),
  };
}

function predictCrunch(history, cycleDay) {
  if (history.length < 4) return null;
  const recent = history.slice(-5);
  const deltas = [];
  for (let i = 1; i < recent.length; i++) deltas.push(recent[i].balance - recent[i - 1].balance);
  const avgBurn = deltas.reduce((a, b) => a + b, 0) / deltas.length;
  if (avgBurn >= 0) return null;
  const current = recent[recent.length - 1].balance;
  const daysLeft = Math.floor(current / Math.abs(avgBurn));
  const predictedDay = cycleDay + daysLeft;
  return predictedDay <= CYCLE_LENGTH ? predictedDay : null;
}

function fmt(n) {
  return `₦${Math.round(n).toLocaleString()}`;
}
function fmtUsdt(n) {
  return `${n.toFixed(2)} USDT`;
}

// Simulated AI copilot responses. Templated rather than a live model call so
// the shared demo behaves identically for every viewer — no API key, no
// Claude account, and no network dependency for anyone opening the link.
// The randomized pick + short "thinking" delay is what sells the feel of a
// model actually reasoning about the user's specific numbers.
const PREDICT_TEMPLATES = [
  (d, s) => `Based on your ${s.toLowerCase()} pattern, expect things to get tight around day ${d} — your buffer will step in before then.`,
  (d) => `You're on track to run low near day ${d}. I've got a buffer ready to smooth that over automatically.`,
  (d) => `Day ${d} looks like where the pinch would hit — no need to worry, your buffer is already positioned to cover it.`,
  (d, s) => `Your ${s.toLowerCase()} spending pace suggests day ${d} could be tight. I'll release funds from your buffer right when it matters.`,
  (d) => `Watching your balance closely — it looks like day ${d} is where it'll dip low, and your buffer is already on standby.`,
];

const RELEASE_TEMPLATES = [
  (amt) => `Your balance dipped low, so I moved ${amt} from your buffer to keep you covered until your next payout.`,
  (amt) => `Covered you — ${amt} just landed back in your balance from your buffer, right when you needed it.`,
  (amt) => `I caught the dip early and topped up your balance with ${amt} from your buffer. You're good until the next payout.`,
  (amt) => `Buffer engaged: ${amt} released to your balance so today's low point doesn't turn into a real problem.`,
];

function pick(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

async function getAiNudge({ sourceLabel, predictedDay, kind, releaseAmt }) {
  const thinkTime = 900 + Math.random() * 900;
  await new Promise((resolve) => setTimeout(resolve, thinkTime));
  if (kind === "predict") {
    return pick(PREDICT_TEMPLATES)(predictedDay, sourceLabel);
  }
  return pick(RELEASE_TEMPLATES)(fmt(releaseAmt));
}

function VerifyScreen({ mode, identifier, method, onVerified, onBack }) {
  const [code, setCode] = useState("");
  const [seconds, setSeconds] = useState(30);
  const [checking, setChecking] = useState(false);

  React.useEffect(() => {
    if (seconds <= 0) return;

    const t = setTimeout(() => setSeconds((s) => s - 1), 1000);
    return () => clearTimeout(t);
  }, [seconds]);

  const isOtp = mode === "signup";
  const targetLen = isOtp ? 6 : 4;

  const maskIdentifier = () => {
    if (method === "email") {
      const [name, domain] = identifier.split("@");
      if (!domain) return identifier;
      const maskedName = name.length <= 1 ? name : name[0] + "•".repeat(Math.max(name.length - 1, 3));
      return `${maskedName}@${domain}`;
    }
    return `0${identifier.slice(1, 3)}••••${identifier.slice(-3)}`;
  };

  const submit = () => {
    if (code.length !== targetLen) return;
    setChecking(true);
    setTimeout(() => onVerified(), 700);
  };

  return (
    <div className="min-h-screen w-full bg-[#0D1B22] text-[#EAF4F1] font-sans flex items-center justify-center px-6">
      <div className="max-w-sm w-full">
        <button onClick={onBack} className="flex items-center gap-1.5 text-sm text-[#7C93A6] hover:text-[#EAF4F1] mb-8 transition-colors">
          <Icon name="chevron-left" size={16} /> Back
        </button>

        <div className="w-11 h-11 rounded-xl bg-[#132732] flex items-center justify-center mb-5">
          {isOtp ? <Icon name="message-square" size={18} className="text-[#3FA796]" /> : <Icon name="key-round" size={18} className="text-[#3FA796]" />}
        </div>

        <h1 className="font-display font-semibold text-xl mb-1">
          {isOtp ? `Verify your ${method === "phone" ? "number" : "email"}` : "Enter your PIN"}
        </h1>
        <p className="text-sm text-[#7C93A6] mb-6 leading-relaxed">
          {isOtp
            ? `We sent a ${targetLen}-digit code to ${maskIdentifier()}.`
            : "Enter your 4-digit PIN to log in, or use biometrics."}
        </p>

        <input
          type="text"
          inputMode="numeric"
          value={code}
          onChange={(e) => setCode(e.target.value.replace(/\D/g, "").slice(0, targetLen))}
          placeholder={"•".repeat(targetLen)}
          className="w-full bg-[#132732] border border-white/10 rounded-lg px-4 py-3.5 text-center text-2xl tracking-[0.5em] font-mono text-[#EAF4F1] placeholder:text-[#4F6373] outline-none focus:border-[#3FA796]/50 mb-4"
        />

        <button
          onClick={submit}
          disabled={code.length !== targetLen || checking}
          className="w-full bg-[#3FA796] hover:bg-[#379186] disabled:bg-[#3FA796]/25 disabled:cursor-not-allowed text-[#0D1B22] font-display font-semibold text-sm px-4 py-3 rounded-lg transition-colors flex items-center justify-center gap-2"
        >
          {checking ? (
            <>
              <Icon name="loader" size={15} className="animate-spin" /> Verifying...
            </>
          ) : isOtp ? (
            "Verify code"
          ) : (
            "Log in"
          )}
        </button>

        {isOtp ? (
          <p className="text-xs text-[#4F6373] mt-4 text-center">
            {seconds > 0 ? (
              `Resend code in ${seconds}s`
            ) : (
              <button onClick={() => setSeconds(30)} className="text-[#3FA796] hover:underline">
                Resend code
              </button>
            )}
          </p>
        ) : (
          <button className="w-full flex items-center justify-center gap-2 text-xs text-[#7C93A6] hover:text-[#EAF4F1] mt-4 py-2">
            <Icon name="fingerprint" size={14} /> Use Face ID / fingerprint instead

        <p className="text-xs text-[#4F6373] mt-6 text-center leading-relaxed">
          Demo mode — any {targetLen}-digit code is accepted.
        </p>
      </div>

  );

            <label className="flex items-start gap-2.5 text-xs text-[#7C93A6] leading-relaxed mb-5 cursor-pointer">

            {error && <p className="text-xs text-[#F2726F] mb-3">{error}</p>}
            <button

          Okra) with a real consent flow and a revocable direct-debit mandate, rather than a typed account number.
        </p>
      </div>
    </div>
  );
}

function SavingsScreen({ state, setState, onBack }) {
  const { savings, day, balance } = state;
  const isConfigured = !!savings.mode;
  const [editing, setEditing] = useState(!isConfigured);
  const [mode, setMode] = useState(savings.mode || "ai");
  const [percent, setPercent] = useState(savings.percent);
  const [periodDays, setPeriodDays] = useState(savings.periodDays);

  const activeStakes = savings.stakes;
  const totalStakedNgn = activeStakes.reduce((sum, s) => sum + s.principalNgn, 0);
  const totalStakedUsdt = totalStakedNgn / USDT_NGN_RATE;
  const nextMaturity = activeStakes.length
    ? Math.min(...activeStakes.map((s) => s.maturityDay - day))
    : null;
  const currentPeriod = SAVINGS_PERIODS.find((p) => p.days === savings.periodDays) || SAVINGS_PERIODS[0];

  const saveSettings = () => {
    const period = SAVINGS_PERIODS.find((p) => p.days === periodDays) || SAVINGS_PERIODS[0];
    setState((prev) => ({
      ...prev,
      savings: { ...prev.savings, mode, percent, periodDays },
      log: [
        ...prev.log,
        {
          day: prev.day,
          kind: "savings-setup",
          text: `Turned on ${mode === "ai" ? "AI" : "manual"} savings — ${percent}% staked for ${period.days} days at ${(period.apy * 100).toFixed(0)}% APY.`,
        },
      ],
    }));
    setEditing(false);
  };

  const stakeNow = () => {
    const amt = balance * (percent / 100);
    if (amt <= 0) return;
    const period = SAVINGS_PERIODS.find((p) => p.days === periodDays) || SAVINGS_PERIODS[0];
    setState((prev) => ({
      ...prev,
      balance: prev.balance - amt,
      savings: {
        ...prev.savings,
        stakes: [
          ...prev.savings.stakes,
          { id: `${prev.day}-${Math.random().toString(36).slice(2, 7)}`, principalNgn: amt, startDay: prev.day, maturityDay: prev.day + period.days, periodDays: period.days, apy: period.apy },
        ],
      },
      log: [
        ...prev.log,
        {
          day: prev.day,
          kind: "stake",
          text: `You staked ${fmt(amt)} (${percent}% of your balance) into USDT savings — matures in ${period.days} days at ${(period.apy * 100).toFixed(0)}% APY.`,

              {savings.mode === "ai" ? "AI" : "Manual"}
            </span>
          )}
        </div>
        <p className="text-sm text-[#7C93A6] mb-8 leading-relaxed">
          Stake a share of your income in USDT and let it earn yield — automatically with AI, or on your own schedule.
        </p>

        {!editing && isConfigured && (
          <div className="bg-[#132732] rounded-2xl border border-white/5 p-6 mb-6">
            <p className="text-xs font-mono uppercase tracking-wider text-[#7C93A6] mb-1">Total staked</p>

                      periodDays === p.days

function WalletPanel({ state, setState, onOpenBank }) {
  const [panel, setPanel] = useState(null); // null | 'receive' | 'send' | 'withdraw'
  const [copied, setCopied] = useState(false);
  const [receiveAmt, setReceiveAmt] = useState("");
  const [sendAddr, setSendAddr] = useState("");
  const [sendAmt, setSendAmt] = useState("");
  const [withdrawAmt, setWithdrawAmt] = useState("");
  const [error, setError] = useState("");

  const copyAddress = async () => {
    try {
      await navigator.clipboard.writeText(WALLET_ADDRESS);
      setCopied(true);
      setTimeout(() => setCopied(false), 1500);
    } catch (e) {}
  };

  const togglePanel = (name) => {
    setError("");
    setPanel((prev) => (prev === name ? null : name));
  };

  const doReceive = () => {
    const amt = parseFloat(receiveAmt);
    if (!amt || amt <= 0) return setError("Enter a valid USDT amount.");
    setState((prev) => ({
      ...prev,
      wallet: { ...prev.wallet, usdt: prev.wallet.usdt + amt },
      log: [...prev.log, { day: prev.day, kind: "wallet-in", text: `Received ${fmtUsdt(amt)} from an external wallet.` }],
    }));
    setReceiveAmt("");
    setPanel(null);
  };

  const doSend = () => {
    const amt = parseFloat(sendAmt);
    if (!sendAddr.trim()) return setError("Enter a recipient address.");
    if (!amt || amt <= 0) return setError("Enter a valid USDT amount.");
    if (amt > state.wallet.usdt) return setError("That's more than your wallet balance.");
    setState((prev) => ({
      ...prev,
      wallet: { ...prev.wallet, usdt: prev.wallet.usdt - amt },
      log: [...prev.log, { day: prev.day, kind: "wallet-out", text: `Sent ${fmtUsdt(amt)} to ${shortAddr(sendAddr.trim())}.` }],
    }));
    setSendAddr("");
    setSendAmt("");
    setPanel(null);
  };

  // Withdraw converts USDT straight to naira at the demo rate, takes the
  // 0.5% exchange fee, and credits the net amount to the linked bank —
  // which is also what "Available balance" represents, so the dashboard
  // balance rises by the net amount every time a withdrawal lands.
  const doWithdraw = () => {
    const amt = parseFloat(withdrawAmt);
    if (!state.linkedBank) return setError("Link a bank account first.");
    if (!amt || amt <= 0) return setError("Enter a valid USDT amount.");
    if (amt > state.wallet.usdt) return setError("That's more than your wallet balance.");
    const gross = amt * USDT_NGN_RATE;
    const fee = gross * FEE_RATE;
    const net = gross - fee;
    const bank = state.linkedBank;
    setState((prev) => ({
      ...prev,
      wallet: { ...prev.wallet, usdt: prev.wallet.usdt - amt },
      balance: prev.balance + net,
      log: [
        ...prev.log,
        {
          day: prev.day,
          kind: "withdraw",
          text: `Withdrew ${fmtUsdt(amt)} → ${fmt(net)} (fee ${fmt(fee)}) credited to ${bank.bank} ****${bank.last4}.`,
        },
      ],
    }));
    setWithdrawAmt("");
    setPanel(null);
  };

  const withdrawPreview = useMemo(() => {
    const amt = parseFloat(withdrawAmt);
    if (!amt || amt <= 0) return null;
    const gross = amt * USDT_NGN_RATE;
    const fee = gross * FEE_RATE;
    return { gross, fee, net: gross - fee };
  }, [withdrawAmt]);

  const actions = [
    { key: "receive", label: "Receive", icon: "arrow-down-to-line" },
    { key: "send", label: "Send", icon: "arrow-up-from-line" },
    { key: "withdraw", label: "Withdraw", icon: "arrow-down-circle" },
  ];

  return (
    <div className="bg-[#132732] rounded-2xl border border-white/5 p-6 mb-6">
      <div className="flex items-center justify-between mb-5 flex-wrap gap-3">
        <div className="flex items-center gap-2">
          <Icon name="wallet" size={16} className="text-[#3FA796]" />
          <p className="text-xs font-mono uppercase tracking-wider text-[#7C93A6]">USDT wallet</p>
        </div>
        <div className="flex items-center gap-2">
          <button
            onClick={copyAddress}
            className="flex items-center gap-1.5 text-xs font-mono text-[#7C93A6] hover:text-[#EAF4F1] bg-[#0D1B22] px-2.5 py-1.5 rounded-md transition-colors"
          >
            {copied ? <Icon name="check" size={12} className="text-[#3FA796]" /> : <Icon name="copy" size={12} />}
            {shortAddr(WALLET_ADDRESS)}
          </button>
        </div>
      </div>

      <p className="font-display font-semibold text-3xl mb-5 tabular-nums">{fmtUsdt(state.wallet.usdt)}</p>

      <div className="flex items-center gap-3 mb-4 flex-wrap">
        {actions.map((a) => {
          const isActive = panel === a.key;
          return (
            <button
              key={a.key}
              onClick={() => togglePanel(a.key)}
              className={`flex items-center gap-1.5 text-sm font-display font-medium px-3.5 py-2 rounded-lg border transition-colors ${
                isActive
                  ? "bg-[#3FA796]/10 border-[#3FA796]/50 text-[#3FA796]"
                  : "bg-white/5 border-white/10 text-[#EAF4F1] hover:bg-white/10"
              }`}
            >
              <Icon name={a.icon} size={14} /> {a.label}
            </button>
          );
        })}
        <span className="text-xs font-mono text-[#4F6373] ml-auto hidden sm:inline">
          rate ₦{USDT_NGN_RATE.toLocaleString()}/USDT · {FEE_RATE * 100}% fee
        </span>
      </div>

      {panel === "receive" && (
        <div className="bg-[#0D1B22] rounded-xl p-4 mt-2">
          <p className="text-xs text-[#7C93A6] mb-3 leading-relaxed">
            Share your address to receive USDT from anywhere. For this demo, simulate an incoming payment below.
          </p>
          <p className="font-mono text-xs text-[#C7D6D2] break-all mb-3">{WALLET_ADDRESS}</p>
          <div className="flex items-center gap-2">
            <input
              type="number"
              value={receiveAmt}
              onChange={(e) => setReceiveAmt(e.target.value)}
              placeholder="Amount (USDT)"
              className="flex-1 bg-[#132732] border border-white/10 rounded-lg px-3 py-2 text-sm text-[#EAF4F1] placeholder:text-[#4F6373] outline-none focus:border-[#3FA796]/50"
            />
            <button onClick={doReceive} className="bg-[#3FA796] hover:bg-[#379186] text-[#0D1B22] font-display font-semibold text-sm px-4 py-2 rounded-lg transition-colors">
              Simulate receipt
            </button>
          </div>
        </div>
      )}

      {panel === "send" && (
        <div className="bg-[#0D1B22] rounded-xl p-4 mt-2 flex flex-col gap-2.5">
          <input
            type="text"
            value={sendAddr}
            onChange={(e) => setSendAddr(e.target.value)}
            placeholder="Recipient address"
            className="bg-[#132732] border border-white/10 rounded-lg px-3 py-2 text-sm font-mono text-[#EAF4F1] placeholder:text-[#4F6373] outline-none focus:border-[#3FA796]/50"
          />
          <div className="flex items-center gap-2">
            <input
              type="number"
              value={sendAmt}
              onChange={(e) => setSendAmt(e.target.value)}
              placeholder="Amount (USDT)"
              className="flex-1 bg-[#132732] border border-white/10 rounded-lg px-3 py-2 text-sm text-[#EAF4F1] placeholder:text-[#4F6373] outline-none focus:border-[#3FA796]/50"
            />
            <button onClick={doSend} className="bg-[#3FA796] hover:bg-[#379186] text-[#0D1B22] font-display font-semibold text-sm px-4 py-2 rounded-lg transition-colors">
              Send
            </button>
          </div>
          <p className="text-xs text-[#4F6373]">Wallet-to-wallet USDT transfers — no fee.</p>
        </div>
      )}

      {panel === "withdraw" && (
        <div className="bg-[#0D1B22] rounded-xl p-4 mt-2 flex flex-col gap-2.5">
          {state.linkedBank ? (
            <>
              <div className="flex items-center gap-2">
                <input
                  type="number"
                  value={withdrawAmt}
                  onChange={(e) => setWithdrawAmt(e.target.value)}
                  placeholder="Amount (USDT)"
                  className="flex-1 bg-[#132732] border border-white/10 rounded-lg px-3 py-2 text-sm text-[#EAF4F1] placeholder:text-[#4F6373] outline-none focus:border-[#3FA796]/50"
                />
                <button onClick={doWithdraw} className="bg-[#D8B25E] hover:bg-[#c6a253] text-[#0D1B22] font-display font-semibold text-sm px-4 py-2 rounded-lg transition-colors">
                  Withdraw
                </button>
              </div>
              {withdrawPreview && (
                <div className="text-xs font-mono text-[#7C93A6] flex flex-col gap-0.5">
                  <span>Converts at: {fmt(withdrawPreview.gross)}</span>
                  <span>Fee ({FEE_RATE * 100}%): -{fmt(withdrawPreview.fee)}</span>
                  <span className="text-[#D8B25E]">Bank receives: {fmt(withdrawPreview.net)}</span>
                </div>
              )}
              <p className="text-xs text-[#4F6373]">
                Converts USDT to naira and credits {state.linkedBank.bank} ****{state.linkedBank.last4} directly —
                no P2P counterparty, no separate swap step. Your available balance above updates immediately.
              </p>
            </>
          ) : (
            <div className="flex items-center justify-between gap-3">
              <p className="text-xs text-[#7C93A6] leading-relaxed">Link a bank account to withdraw USDT as naira.</p>
              <button onClick={onOpenBank} className="bg-[#3FA796] hover:bg-[#379186] text-[#0D1B22] font-display font-semibold text-xs px-3.5 py-2 rounded-lg transition-colors whitespace-nowrap">
                Link bank
              </button>
            </div>
          )}
        </div>
      )}

      {error && <p className="text-xs text-[#F2726F] mt-2">{error}</p>}
    </div>
  );
}

  const handleAuthSubmit = useCallback((mode, identifier, method) => {
    setAuthMode(mode);
    setAuthIdentifier(identifier);
    setAuthMethod(method);
    setScreen("verify");
  }, []);

  // Google already verifies the account, so it skips OTP/PIN entirely —

    setAuthIdentifier("demo.user@gmail.com");
    setAuthMethod("google");
    setScreen(mode === "signup" ? "kyc" : "onboarding");
  }, []);

  const handleVerified = useCallback(() => {
    setScreen(authMode === "signup" ? "kyc" : "onboarding");
  }, [authMode]);

  const handleKycComplete = useCallback(() => {
    setScreen("onboarding");
  }, []);

  const handleSelectSource = useCallback((source) => {
    setSelectedSourceId(source.id);
    setConnecting(true);
    setTimeout(() => {
      setState(buildInitialState(source));
      setConnecting(false);
      setScreen("dashboard");
    }, 900);
  }, []);

  const crunchPrediction = useMemo(
    () => (state ? predictCrunch(state.history, state.cycleDay) : null),
    [state]
  );

  const runAiNudge = useCallback((payload) => {
    setState((prev) => (prev ? { ...prev, aiPending: true } : prev));
    getAiNudge(payload).then((text) => {
      setState((prev) => {
        if (!prev) return prev;
        const log = [...prev.log];
        for (let i = log.length - 1; i >= 0; i--) {
          if (log[i].kind === payload.kind && log[i].pending) {
            log[i] = { ...log[i], text, pending: false };
            break;
          }
        }
        return { ...prev, log, aiPending: false };
      });
    });
  }, []);

  const advanceDay = useCallback(() => {
    setState((prev) => {
      if (!prev) return prev;
      if (!prev.linkedBank) return prev; // nothing to simulate until a bank is connected
      const rand = prev.rand;
      let { day, cycleDay, balance, buffer, history, log, crunchDay, released, source, savings } = prev;

      day += 1;
      cycleDay += 1;
      let newLog = [...log];
      let newCrunchDay = crunchDay;
      let newReleased = released;
      let newStakes = savings.stakes;
      let triggerAi = null;

      if (cycleDay > CYCLE_LENGTH) {
        cycleDay = 1;
        const locked = source.amount * LOCK_RATE;
        let stakeAmt = 0;
        if (savings.mode === "ai" && savings.percent > 0) {
          const period = SAVINGS_PERIODS.find((p) => p.days === savings.periodDays) || SAVINGS_PERIODS[0];
          stakeAmt = source.amount * (savings.percent / 100);
          newStakes = [
            ...newStakes,
            { id: `${day}-${Math.random().toString(36).slice(2, 7)}`, principalNgn: stakeAmt, startDay: day, maturityDay: day + period.days, periodDays: period.days, apy: period.apy },
          ];
          newLog.push({
            day,
            kind: "stake",
            text: `AI staked ${fmt(stakeAmt)} (${savings.percent}% of your payout) into USDT savings — matures in ${period.days} days at ${(period.apy * 100).toFixed(0)}% APY.`,
          });
        }
        balance += source.amount - locked - stakeAmt;
        buffer += locked;
        newLog.push({
          day,
          kind: "inflow",
          text: `New payout — ₦${source.amount.toLocaleString()} in. Locking ${fmt(locked)} into your buffer.`,
        });
        newCrunchDay = null;
        newReleased = false;
      } else {
        const weight = SPEND_PROFILE[(cycleDay - 1) % SPEND_PROFILE.length];
        const noise = 0.7 + rand() * 0.6;
        const spend = DAILY_BASE_SPEND * weight * noise;
        balance -= spend;
      }

      // Release any stakes that have reached maturity, principal + yield, back into balance
      const stillLocked = [];
      newStakes.forEach((s) => {
        if (s.maturityDay <= day) {
          const yieldAmt = s.principalNgn * s.apy * (s.periodDays / 365);
          const payout = s.principalNgn + yieldAmt;
          balance += payout;
          newLog.push({
            day,
            kind: "matured",
            text: `Your ${s.periodDays}-day USDT stake matured — ${fmt(payout)} credited to your balance (${fmt(yieldAmt)} yield).`,
          });
        } else {
          stillLocked.push(s);
        }
      });
      newStakes = stillLocked;

      const newHistory = [...history, { day, balance }].slice(-30);
      const predicted = predictCrunch(newHistory, cycleDay);

      if (predicted && !newCrunchDay && !newReleased) {
        newCrunchDay = predicted;
        newLog.push({ day, kind: "predict", pending: true, text: "Buffer AI is thinking..." });
        triggerAi = { kind: "predict", sourceLabel: source.label, balance, predictedDay: predicted, cycleDay };
      }

      if (balance < 3000 && buffer > 0 && !newReleased) {
        const gross = Math.min(buffer, source.amount * 0.4);
        const fee = gross * FEE_RATE;
        const net = gross - fee;
        balance += net;
        buffer -= gross;
        newReleased = true;
        newLog.push({ day, kind: "release", pending: true, text: "Buffer AI is thinking..." });
        triggerAi = { kind: "release", sourceLabel: source.label, releaseAmt: net, feeAmt: fee, cycleDay };
      }

      const next = {
        ...prev,
        day,
        cycleDay,
        balance,
        buffer,
        history: newHistory,
        log: newLog,
        crunchDay: newCrunchDay,
        released: newReleased,
        savings: { ...savings, stakes: newStakes },
      };
      if (triggerAi) setTimeout(() => runAiNudge(triggerAi), 0);
      return next;
    });
  }, [runAiNudge]);

  const advanceWeek = useCallback(() => {
    for (let i = 0; i < 7; i++) advanceDay();
  }, [advanceDay]);

  const reset = useCallback(() => {
    setScreen("onboarding");
    setSelectedSourceId(null);
    setState(null);
  }, []);

  if (screen === "auth") {
    return <AuthScreen onSubmit={handleAuthSubmit} onGoogleAuth={handleGoogleAuth} />;
  }

  if (screen === "verify") {
    return (
      <VerifyScreen
        mode={authMode}
        identifier={authIdentifier}
        method={authMethod}
        onVerified={handleVerified}
        onBack={() => setScreen("auth")}
      />
    );
  }

  if (screen === "kyc") {
    return <KycScreen onComplete={handleKycComplete} />;
  }

  if (screen === "onboarding" || !state) {
    return <Onboarding onSelect={handleSelectSource} loading={connecting} selectedId={selectedSourceId} />;
  }

  if (screen === "bank") {
    return <BankLinkScreen state={state} setState={setState} onBack={() => setScreen("dashboard")} />;
  }

  if (screen === "savings") {
    return <SavingsScreen state={state} setState={setState} onBack={() => setScreen("dashboard")} />;
  }

  const tankPct = Math.max(0, Math.min(100, (state.balance / state.source.amount) * 100));
  const bufferPct = Math.max(0, Math.min(100, (state.buffer / (state.source.amount * LOCK_RATE)) * 100));
  const recentLog = [...state.log].reverse().slice(0, 7);

  const logColor = (entry) => {
    if (entry.pending) return "text-[#4F6373] italic";
    switch (entry.kind) {
      case "release":
        return "text-[#D8B25E]";
      case "predict":
        return "text-[#F2726F]";
      case "wallet-in":
        return "text-[#3FA796]";
      case "wallet-out":
        return "text-[#C7D6D2]";
      case "withdraw":
        return "text-[#3FA796]";
      case "bank":
        return "text-[#7C93A6]";
      case "stake":
        return "text-[#D8B25E]";
      case "matured":
        return "text-[#D8B25E]";
      case "savings-setup":
        return "text-[#7C93A6]";
      default:
        return "text-[#C7D6D2]";
    }
  };

  return (
    <div className="min-h-screen w-full bg-[#0D1B22] text-[#EAF4F1] font-sans">
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap');
        .font-display { font-family: 'Space Grotesk', sans-serif; }
        .font-body { font-family: 'Inter', sans-serif; }
        .font-mono { font-family: 'IBM Plex Mono', monospace; }
      `}</style>

      <div className="max-w-5xl mx-auto px-6 py-10 font-body">
        <div className="flex items-center justify-between mb-10 flex-wrap gap-3">
          <div className="flex items-center gap-2.5">
            <Icon name="droplets" size={22} className="text-[#3FA796]" strokeWidth={2.2} />
            <span className="font-display font-semibold text-lg tracking-tight">Buffer</span>
            <span className="text-xs font-mono text-[#4F6373] ml-2">· {state.source.label}</span>
          </div>
          <div className="flex items-center gap-4">
            <button
              onClick={() => setScreen("bank")}
              className={
                state.linkedBank
                  ? "flex items-center gap-2 text-xs font-mono font-semibold px-3.5 py-2 rounded-full text-[#3FA796] bg-[#3FA796]/10 border border-[#3FA796]/30 transition-colors"
                  : "flex items-center gap-2 text-sm font-display font-semibold px-4 py-2.5 rounded-full text-[#0D1B22] bg-[#D8B25E] hover:bg-[#e6c076] shadow-[0_0_0_1px_rgba(216,178,94,0.4),0_0_24px_rgba(216,178,94,0.35)] transition-colors"
              }
            >
              {state.linkedBank ? (
                <>
                  <Icon name="landmark" size={12} />
                  {state.linkedBank.bank} ****{state.linkedBank.last4}
                </>
              ) : (
                <>
                  <span className="relative flex h-2 w-2">
                    <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-[#0D1B22] opacity-60" />
                    <span className="relative inline-flex rounded-full h-2 w-2 bg-[#0D1B22]" />
                  </span>
                  <Icon name="landmark" size={15} />
                  Link your bank
                </>
              )}
            </button>
            <span className="text-xs font-mono text-[#7C93A6] uppercase tracking-wider">
              Cycle day {state.cycleDay} / {CYCLE_LENGTH} · Total day {state.day}
            </span>
          </div>
        </div>

        <div className="grid grid-cols-1 md:grid-cols-[1.1fr_1fr] gap-6 mb-6">
          <div className="bg-[#132732] rounded-2xl p-7 border border-white/5">
            <p className="text-xs font-mono uppercase tracking-wider text-[#7C93A6] mb-1">Available balance</p>
            <p className="font-display font-semibold text-4xl mb-6 tabular-nums">{fmt(state.balance)}</p>

            {state.linkedBank ? (
              <>
                <div className="relative h-40 rounded-xl overflow-hidden bg-[#0D1B22] border border-white/5">
                  <div
                    className="absolute bottom-0 left-0 right-0 transition-all duration-500 ease-out"
                    style={{ height: `${tankPct}%`, background: "linear-gradient(180deg, #3FA796 0%, #2C7A72 100%)" }}
                  />
                  {crunchPrediction && (
                    <div
                      className="absolute left-0 right-0 border-t border-dashed border-[#F2726F]/70 flex items-center"
                      style={{
                        bottom: `${Math.max(
                          0,
                          Math.min(
                            100,
                            ((state.balance - DAILY_BASE_SPEND * (crunchPrediction - state.cycleDay)) / state.source.amount) * 100
                          )
                        )}%`,
                      }}
                    >
                      <span className="text-[10px] font-mono text-[#F2726F] bg-[#0D1B22] px-1.5 -mt-2 ml-2 rounded">
                        predicted low · day {crunchPrediction}
                      </span>
                    </div>
                  )}
                </div>

                <div className="mt-5 h-12">
                  <Sparkline data={state.history} />
                </div>
              </>
            ) : (
              <div className="rounded-xl border border-dashed border-[#D8B25E]/40 bg-[#D8B25E]/5 p-6 flex flex-col items-center text-center gap-3">
                <Icon name="landmark" size={20} className="text-[#D8B25E]" />
                <p className="text-sm font-display font-medium">Link your bank to activate Buffer</p>
                <p className="text-xs text-[#7C93A6] leading-relaxed max-w-xs">
                  Available balance mirrors your linked bank account — there's nothing to track, predict, or
                  protect until it's connected.
                </p>
                <button
                  onClick={() => setScreen("bank")}
                  className="bg-[#D8B25E] hover:bg-[#e6c076] text-[#0D1B22] font-display font-semibold text-sm px-4 py-2 rounded-lg transition-colors"
                >
                  Link bank account
                </button>
              </div>
            )}
          </div>

          <div className="flex flex-col gap-6">
            <div className="bg-[#132732] rounded-2xl p-6 border border-white/5 flex-1">
              <div className="flex items-center gap-2 mb-1">
                <Icon name="shield-check" size={16} className="text-[#D8B25E]" />
                <p className="text-xs font-mono uppercase tracking-wider text-[#7C93A6]">Buffer (USDT)</p>
              </div>
              <p className="font-display font-semibold text-3xl mb-4 tabular-nums">{fmt(state.buffer)}</p>
              <div className="h-2 rounded-full bg-[#0D1B22] overflow-hidden">
                <div className="h-full transition-all duration-500" style={{ width: `${bufferPct}%`, background: "#D8B25E" }} />
              </div>
              <p className="text-xs text-[#7C93A6] mt-3 leading-relaxed">
                {LOCK_RATE * 100}% of every payout is swept into a stablecoin buffer automatically. Releases
                back to naira carry a {FEE_RATE * 100}% release fee.
              </p>
            </div>

            <div className="bg-[#132732] rounded-2xl p-6 border border-white/5">
              <div className="flex items-center gap-2 mb-1">
                {state.aiPending ? (
                  <Icon name="loader" size={16} className="text-[#F2726F] animate-spin" />
                ) : (
                  <Icon name="sparkles" size={16} className="text-[#F2726F]" />
                )}
                <p className="text-xs font-mono uppercase tracking-wider text-[#7C93A6]">AI prediction</p>
              </div>
              <p className="font-display font-medium text-base leading-snug mt-2">
                {crunchPrediction
                  ? state.released
                    ? "Buffer already released to cover this cycle's crunch."
                    : `Projected to run low around day ${crunchPrediction}.`
                  : "Spending pace looks steady — no crunch predicted yet."}
              </p>
            </div>
          </div>
        </div>

        <SavingsSummaryCard state={state} onOpen={() => setScreen("savings")} />

        <WalletPanel state={state} setState={setState} onOpenBank={() => setScreen("bank")} />

        <div className="flex items-center gap-3 mb-2 flex-wrap">
          <button
            onClick={advanceDay}
            disabled={!state.linkedBank}
            className="flex items-center gap-1.5 bg-[#3FA796] hover:bg-[#379186] disabled:bg-[#3FA796]/25 disabled:cursor-not-allowed disabled:hover:bg-[#3FA796]/25 text-[#0D1B22] font-display font-semibold text-sm px-4 py-2.5 rounded-lg transition-colors"
          >
            <Icon name="zap" size={15} /> Advance 1 day
          </button>
          <button
            onClick={advanceWeek}
            disabled={!state.linkedBank}
            className="flex items-center gap-1.5 bg-white/5 hover:bg-white/10 disabled:opacity-30 disabled:cursor-not-allowed disabled:hover:bg-white/5 border border-white/10 font-display font-medium text-sm px-4 py-2.5 rounded-lg transition-colors"
          >
            Advance 7 days <Icon name="chevron-right" size={15} />
          </button>
          <button
            onClick={reset}
            className="flex items-center gap-1.5 text-[#7C93A6] hover:text-[#EAF4F1] text-sm px-3 py-2.5 rounded-lg transition-colors ml-auto"
          >
            <Icon name="rotate-ccw" size={14} /> Switch income source
          </button>
        </div>
        <p className="text-xs text-[#4F6373] mb-6 leading-relaxed">
          {state.linkedBank
            ? "Advance the days to watch Buffer automatically predict a cash crunch and top up your balance from your buffer when it happens — no action needed from you."
            : "Link a bank above to start advancing days."}
        </p>

        <div className="bg-[#132732] rounded-2xl border border-white/5 p-6">
          <p className="text-xs font-mono uppercase tracking-wider text-[#7C93A6] mb-4">Activity</p>
          <div className="flex flex-col gap-3">
            {recentLog.length === 0 ? (
              <p className="text-sm text-[#4F6373] italic">Nothing yet — link your bank to get started.</p>
            ) : (
              recentLog.map((entry, i) => (
                <div key={i} className="flex items-start gap-3 text-sm">
                  <span className="font-mono text-xs text-[#4F6373] w-12 shrink-0 pt-0.5">Day {entry.day}</span>
                  <span className={logColor(entry)}>{entry.text}</span>
                </div>
              ))
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

const rootEl = document.getElementById("root");
ReactDOM.createRoot(rootEl).render(<BufferDemo />);
</script>
</body>
</html>
